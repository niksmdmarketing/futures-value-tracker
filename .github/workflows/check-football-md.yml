name: Check football-md.com (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check football-md.com (plain HTTP)
        run: python scripts/diagnostics/check_football_md.py

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check football-md.com (rendered)
        run: python scripts/diagnostics/check_football_md_rendered.py
