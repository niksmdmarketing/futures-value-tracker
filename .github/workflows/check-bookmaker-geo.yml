name: Check bookmaker geo-access (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check geo-access
        run: python scripts/diagnostics/check_bookmaker_geo.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmaker-screenshots
          path: /tmp/*_screenshot.png
          if-no-files-found: ignore
