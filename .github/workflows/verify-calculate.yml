name: Verify calculate (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py

      - name: Fetch probabilities
        run: python scripts/fetch_probabilities.py

      - name: Calculate edges
        run: python scripts/calculate.py

      - name: Print resulting data.json
        run: cat docs/data.json
