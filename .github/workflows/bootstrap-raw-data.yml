name: Bootstrap raw data (one-off)

# One-time seed: fetches both odds and probabilities and commits both
# raw data trees, so fetch-odds.yml and fetch-probabilities.yml (which
# now each depend on the other's last-committed raw data) have
# something to read on their first independent runs. Delete this
# workflow once it's been run successfully.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py

      - name: Fetch probabilities
        run: python scripts/fetch_probabilities.py

      - name: Calculate edges
        run: python scripts/calculate.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.json data/raw/probabilities/*.json docs/data.json
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Bootstrap raw odds/probabilities data"
            git pull --rebase origin master
            git push
          fi
